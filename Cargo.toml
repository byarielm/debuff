[package]
name = "debuff"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "any", "json", "chrono", "migrate"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", features = ["json"] }
p256 = { version = "0.13", features = ["pkcs8", "ecdsa"] }
k256 = { version = "0.13", features = ["ecdsa"] }
multibase = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde_ipld_dagcbor = "0.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
toml_edit = "0.22"
bytes = "1"
http-body-util = "0.1"
atrium-oauth = { version = "0.1", features = ["default-client"] }
atrium-identity = { version = "0.1", features = ["doh-handle-resolver"] }
atrium-common = "0.1"
atrium-api = { version = "0.25", features = ["agent"] }
atrium-xrpc = "0.12"
jose-jwk = { version = "0.1", default-features = false, features = ["p256"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed", "cookie-key-expansion", "query"] }

[dev-dependencies]
serial_test = "3"
wiremock = "0.6"
paste = "1"
tempfile = "3"
futures-util = "0.3"
cookie = "0.18"
